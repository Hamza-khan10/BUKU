  # ═════════════════════════════ API GATEWAY ═════════════════════════════

  kong:
    <<: *infra
    networks:
      [
        published,
        kong-cache,
        svc-auth,
        svc-booking,
        svc-queue,
        svc-notification,
        svc-business,
        svc-billing,
        svc-search,
        svc-ads,
        svc-analytics,
      ]
    image: kong:3.9.3
    environment:
      KONG_DATABASE: 'off'
      KONG_DECLARATIVE_CONFIG: /tmp/kong.yml
      # Public key(s) for the gateway's access-token check (render-config.sh).
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      JWT_KEY_ID: ${JWT_KEY_ID}
      JWT_PREVIOUS_PUBLIC_KEY: ${JWT_PREVIOUS_PUBLIC_KEY:-}
      JWT_PREVIOUS_KEY_ID: ${JWT_PREVIOUS_KEY_ID:-}
      # The web app's server key: lets it pass on its visitors' addresses (D-084).
      WEB_GATEWAY_KEY: ${WEB_GATEWAY_KEY:-}
      # The admin app's server key: the only way to reach /v1/admin (D-091).
      ADMIN_GATEWAY_KEY: ${ADMIN_GATEWAY_KEY:-}
      KONG_PROXY_LISTEN: '0.0.0.0:8000'
      # Admin API: inside this container only (D-092). In DB-less mode it can replace the whole
      # gateway configuration, so nothing on any network may reach it. To look at it while debugging:
      # docker exec buku-kong-1 resty -e 'print(require("resty.http").new():request_uri("http://127.0.0.1:8001/status").body)'
      # Off entirely in production.
      KONG_ADMIN_LISTEN: '127.0.0.1:8001'
      KONG_STATUS_LISTEN: '127.0.0.1:8100'
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      # Don't advertise the gateway product/version in response headers.
      KONG_HEADERS: 'off'
      KONG_NGINX_PROXY_SERVER_TOKENS: 'off'
      # Kong's own Valkey user: only its rate-limit counters (D-092).
      KONG_REDIS_PASSWORD: ${VALKEY_PASSWORD_KONG:?run pnpm bootstrap}
      # Re-resolve service hostnames every 5s. Docker DNS answers carry a long
      # TTL; without this Kong keeps routing to a replaced container's old IP
      # (504s after every service restart or deploy).
      KONG_DNS_VALID_TTL: '5'
      # One nginx worker per CPU by default: on a 12-core laptop that is ~490 MB, at the
      # container's memory limit (Kong slowed to a crawl). Two are plenty for development.
      KONG_NGINX_WORKER_PROCESSES: '2'
    entrypoint: ['/bin/sh', '/kong/render-config.sh']
    volumes:
      - ./infrastructure/kong/kong.template.yml:/kong/kong.template.yml:ro
      - ./infrastructure/kong/render-config.sh:/kong/render-config.sh:ro
    ports: ['127.0.0.1:8000:8000']
    depends_on:
      valkey: { condition: service_healthy }
      auth-service: { condition: service_healthy }
      booking-service: { condition: service_healthy }
      business-service: { condition: service_healthy }
      billing-service: { condition: service_healthy }
      queue-service: { condition: service_healthy }
      notification-service: { condition: service_healthy }
      search-service: { condition: service_healthy }
      # ads-service / analytics-service are opt-in profiles (deferred features);
      # their routes answer 503 until those profiles are started.
    healthcheck:
      test: ['CMD', 'kong', 'health']
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 15s
    deploy: { resources: { limits: { memory: 512m } } }

  # ═════════════════════════════ OPTIONAL TOOLS (--profile tools) ═════════════════════════════

  kibana:
    <<: *infra
    networks: [tools]
    profiles: [elasticsearch]
    image: docker.elastic.co/kibana/kibana:9.5.3
    environment:
      ELASTICSEARCH_HOSTS: '["http://elasticsearch:9200"]'
    ports: ['127.0.0.1:5601:5601']
    depends_on:
      elasticsearch: { condition: service_healthy }
    deploy: { resources: { limits: { memory: 1g } } }

  kafka-ui:
    <<: *infra
    networks: [tools]
    profiles: [tools]
    image: kafbat/kafka-ui:v1.5.0
    environment:
      KAFKA_CLUSTERS_0_NAME: buku-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      # Signs in as buku-tools: may look at topics and groups, change nothing (D-092).
      KAFKA_CLUSTERS_0_PROPERTIES_SECURITY_PROTOCOL: SASL_PLAINTEXT
      KAFKA_CLUSTERS_0_PROPERTIES_SASL_MECHANISM: SCRAM-SHA-512
      KAFKA_CLUSTERS_0_PROPERTIES_SASL_JAAS_CONFIG: org.apache.kafka.common.security.scram.ScramLoginModule required username="buku-tools" password="${KAFKA_PASSWORD_TOOLS:?run pnpm bootstrap}";
      DYNAMIC_CONFIG_ENABLED: 'false'
    ports: ['127.0.0.1:8080:8080']
    depends_on:
      kafka: { condition: service_healthy }
    deploy: { resources: { limits: { memory: 512m } } }

  redis-insight:
    <<: *infra
    networks: [tools]
    profiles: [tools]
    image: redis/redisinsight:3.8.0
    ports: ['127.0.0.1:5540:5540']
    depends_on:
      valkey: { condition: service_healthy }
    deploy: { resources: { limits: { memory: 256m } } }
