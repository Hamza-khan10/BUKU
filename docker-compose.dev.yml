# ═══════════════════════════════════════════════════════════════════════════
# BUKU — local development stack
#
#   pnpm bootstrap       # once: generates .env secrets, installs deps
#   pnpm dev             # start (first run builds images: a few minutes)
#   pnpm dev:tools       # + Kibana, Kafka UI, Redis Insight (needs more RAM)
#   pnpm health          # ✔/✘ for every component
#   pnpm dev:down        # stop   ·   pnpm dev:wipe  # stop + delete all data
#
# Security posture, even in dev (so dev mirrors prod):
#   • No secret is written in this file; all come from .env (git-ignored).
#   • Every published port binds to 127.0.0.1 only — nothing is reachable
#     from your network. Services are NOT published at all: the only way in
#     is the Kong gateway on :8000, exactly like production.
#   • Each service receives only the secrets it needs (only auth-service
#     gets the JWT private key; nobody but Postgres gets the superuser pw).
#   • Node containers run as non-root, read-only root filesystem, all Linux
#     capabilities dropped, no privilege escalation.
#
# Endpoints (host):
#   API gateway   http://localhost:8000        Kong admin   http://localhost:8001
#   Mailpit UI    http://localhost:8025        S3 console   http://localhost:9101
#   Postgres      localhost:5432               Valkey       localhost:6379
#   Kafka         localhost:9092               Elasticsearch http://localhost:9200
#   ClickHouse    http://localhost:8123        S3 API       http://localhost:9100
#   --profile tools: Kibana :5601 · Kafka UI :8080 · Redis Insight :5540
# ═══════════════════════════════════════════════════════════════════════════

name: buku

networks:
  buku:
    driver: bridge

volumes:
  postgres-data:
  valkey-data:
  kafka-data:
  elasticsearch-data:
  clickhouse-data:
  s3-data:

# ── Shared building blocks ─────────────────────────────────────────────────
x-logging: &logging
  driver: json-file
  options: { max-size: '10m', max-file: '3' }

x-infra: &infra
  restart: unless-stopped
  networks: [buku]
  logging: *logging

x-oneshot: &oneshot
  restart: 'no'
  networks: [buku]
  logging: *logging

# One image for every Node workload, built once from docker/node/Dockerfile.dev.
x-node-image: &node-image
  image: buku/node-dev:local
  build:
    context: .
    dockerfile: docker/node/Dockerfile.dev

x-node-hardening: &node-hardening
  user: node
  init: true # tini as PID 1: forwards SIGTERM for graceful shutdown, reaps zombies
  read_only: true
  tmpfs: ['/tmp:size=64m']
  cap_drop: [ALL]
  security_opt: ['no-new-privileges:true']

# Source is mounted READ-ONLY for hot reload; dependencies stay in the image.
x-shared-src: &shared-src # used by db-migrate
  - ./packages/common/src:/app/packages/common/src:ro
  - ./packages/database/src:/app/packages/database/src:ro
  - ./packages/database/prisma:/app/packages/database/prisma:ro
  - ./packages/kafka/src:/app/packages/kafka/src:ro

x-service-env: &service-env
  NODE_ENV: development
  LOG_LEVEL: ${LOG_LEVEL:-info}
  LOG_PRETTY: 'true'
  TRUST_PROXY_HOPS: '1'
  KAFKA_BROKERS: kafka:29092
  JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?run pnpm bootstrap}
  JWT_KEY_ID: ${JWT_KEY_ID:?run pnpm bootstrap}
  JWT_ISSUER: ${JWT_ISSUER:-https://auth.buku.local}
  JWT_AUDIENCE: ${JWT_AUDIENCE:-buku-api}
  DATABASE_URL: postgresql://buku_app:${BUKU_APP_PASSWORD:?run pnpm bootstrap}@postgres:5432/buku
  DATABASE_POOL_SIZE: '5'

# Object storage, for services that store files (business, auth).
x-s3-env: &s3-env
  S3_ENDPOINT: http://s3:9000
  # Presigned links must point at an address the BROWSER can reach.
  S3_PUBLIC_ENDPOINT: http://localhost:9100
  S3_REGION: us-east-1
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
  S3_FORCE_PATH_STYLE: 'true'
  S3_BUCKET_MEDIA: buku-media-dev
  S3_BUCKET_PRIVATE: buku-private-dev

x-node-healthcheck: &node-healthcheck
  interval: 10s
  timeout: 5s
  retries: 12
  start_period: 30s

x-needs-core: &needs-core
  postgres: { condition: service_healthy }
  kafka-init: { condition: service_completed_successfully }
  db-migrate: { condition: service_completed_successfully }

services:
  # ═════════════════════════════ DATA STORES ═════════════════════════════

  postgres:
    <<: *infra
    build: { context: docker/postgres }
    image: buku/postgres:local
    shm_size: 256mb
    environment:
      POSTGRES_USER: buku_admin
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?run pnpm bootstrap}
      POSTGRES_DB: buku
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C.UTF-8 --data-checksums'
      BUKU_MIGRATOR_PASSWORD: ${BUKU_MIGRATOR_PASSWORD:?run pnpm bootstrap}
      BUKU_APP_PASSWORD: ${BUKU_APP_PASSWORD:?run pnpm bootstrap}
    command: >
      postgres
        -c shared_buffers=256MB
        -c effective_cache_size=768MB
        -c work_mem=8MB
        -c maintenance_work_mem=128MB
        -c max_connections=150
        -c password_encryption=scram-sha-256
        -c log_min_duration_statement=500
        -c log_lock_waits=on
        -c idle_in_transaction_session_timeout=60s
        -c shared_preload_libraries=pg_stat_statements
    volumes: [postgres-data:/var/lib/postgresql/data]
    ports: ['127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U buku_admin -d buku -q']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    deploy: { resources: { limits: { memory: 1g } } }

  valkey:
    <<: *infra
    image: valkey/valkey:8.1.4-alpine
    # noeviction: this instance holds booking locks, queue state and BullMQ
    # jobs. An LRU policy would silently DELETE them under memory pressure.
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        umask 077
        printf 'requirepass %s\n' "$$VALKEY_PASSWORD" > /tmp/auth.conf
        exec valkey-server /tmp/auth.conf \
          --maxmemory 384mb \
          --maxmemory-policy noeviction \
          --appendonly yes \
          --appendfsync everysec \
          --save 900 1 --save 300 100 --save 60 10000 \
          --rename-command FLUSHALL '' \
          --rename-command FLUSHDB '' \
          --rename-command DEBUG ''
    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:?run pnpm bootstrap}
      REDISCLI_AUTH: ${VALKEY_PASSWORD}
    volumes: [valkey-data:/data]
    ports: ['127.0.0.1:6379:6379']
    healthcheck:
      test: ['CMD-SHELL', 'valkey-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 20
    deploy: { resources: { limits: { memory: 512m } } }

  kafka:
    <<: *infra
    image: apache/kafka:4.3.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: CONTROLLER://:9093,INTERNAL://:29092,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # Topics are created explicitly from the registry — a typo in a topic
      # name must fail loudly, not silently create a new empty topic.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: '-Xms384m -Xmx384m'
      # 22-char base64 UUID; regenerate with: bash scripts/generate-cluster-id.sh
      CLUSTER_ID: cjrnsqVhRfiYZARrnNIQdw
    volumes: [kafka-data:/var/lib/kafka/data]
    ports: ['127.0.0.1:9092:9092']
    healthcheck:
      test:
        [
          'CMD-SHELL',
          '/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 > /dev/null 2>&1',
        ]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s
    deploy: { resources: { limits: { memory: 1g } } }

  elasticsearch:
    profiles: [elasticsearch]
    <<: *infra
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.3
    environment:
      discovery.type: single-node
      cluster.name: buku-local
      # DEV ONLY: security off on a private network bound to localhost.
      # Production MUST enable xpack security + TLS (docs/SECURITY.md).
      xpack.security.enabled: 'false'
      xpack.ml.enabled: 'false'
      action.destructive_requires_name: 'true'
      ES_JAVA_OPTS: '-Xms512m -Xmx512m'
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    volumes: [elasticsearch-data:/usr/share/elasticsearch/data]
    ports: ['127.0.0.1:9200:9200']
    healthcheck:
      test:
        [
          'CMD-SHELL',
          "curl -sf 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' > /dev/null",
        ]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 40s
    deploy: { resources: { limits: { memory: 1280m } } }

  clickhouse:
    profiles: [analytics]
    <<: *infra
    image: clickhouse/clickhouse-server:26.3.36-alpine
    environment:
      CLICKHOUSE_DB: buku_analytics
      CLICKHOUSE_USER: buku_analytics
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?run pnpm bootstrap}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: '0'
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./infrastructure/clickhouse/init:/docker-entrypoint-initdb.d:ro
    ports: ['127.0.0.1:8123:8123']
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:8123/ping | grep -q Ok']
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    deploy: { resources: { limits: { memory: 1g } } }

  # S3-compatible object storage (production: DigitalOcean Spaces).
  s3:
    <<: *infra
    image: rustfs/rustfs:1.0.0
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY_ID:?run pnpm bootstrap}
      RUSTFS_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:?run pnpm bootstrap}
      RUSTFS_ADDRESS: ':9000'
      RUSTFS_CONSOLE_ENABLE: 'true'
      RUSTFS_CONSOLE_ADDRESS: ':9001'
      RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS: http://localhost:9101
    volumes: [s3-data:/data]
    ports: ['127.0.0.1:9100:9000', '127.0.0.1:9101:9001']
    deploy: { resources: { limits: { memory: 512m } } }

  # Catches every outgoing email in dev (production: AWS SES via SMTP).
  mailpit:
    <<: *infra
    image: axllent/mailpit:v1.31.3
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 'true'
      MP_SMTP_AUTH_ALLOW_INSECURE: 'true'
      MP_MAX_MESSAGES: 2000
    ports: ['127.0.0.1:8025:8025', '127.0.0.1:1025:1025']
    deploy: { resources: { limits: { memory: 128m } } }

  # ═════════════════════════════ ONE-SHOT SETUP JOBS ═════════════════════════════

  kafka-init:
    <<: [*oneshot, *node-image, *node-hardening]
    working_dir: /app/packages/kafka
    command: ['/app/node_modules/.bin/tsx', 'scripts/sync-topics.ts']
    environment:
      KAFKA_BROKERS: kafka:29092
      KAFKA_REPLICATION_FACTOR: '1'
      KAFKA_MIN_INSYNC_REPLICAS: '1'
    volumes:
      [
        ./packages/kafka/src:/app/packages/kafka/src:ro,
        ./packages/kafka/scripts:/app/packages/kafka/scripts:ro,
      ]
    depends_on:
      kafka: { condition: service_healthy }

  db-migrate:
    <<: [*oneshot, *node-image, *node-hardening]
    working_dir: /app/packages/database
    command:
      ['sh', '-c', 'node_modules/.bin/prisma migrate deploy && /app/node_modules/.bin/tsx prisma/seed.ts']
    environment:
      NODE_ENV: development
      # Migrations run as the schema owner; the seed also uses PII keys to
      # encrypt demo users' contact details exactly like the real app will.
      DATABASE_MIGRATION_URL: postgresql://buku_migrator:${BUKU_MIGRATOR_PASSWORD}@postgres:5432/buku
      PII_ENCRYPTION_KEYS: ${PII_ENCRYPTION_KEYS:?run pnpm bootstrap}
      PII_ENCRYPTION_ACTIVE_KEY_ID: ${PII_ENCRYPTION_ACTIVE_KEY_ID:-k1}
      PII_BLIND_INDEX_KEY: ${PII_BLIND_INDEX_KEY:?run pnpm bootstrap}
    volumes: *shared-src
    depends_on:
      postgres: { condition: service_healthy }

  elasticsearch-init:
    profiles: [elasticsearch]
    <<: *oneshot
    image: curlimages/curl:8.22.0
    user: curl_user
    entrypoint: ['/bin/sh', '/init/init.sh']
    environment:
      ELASTICSEARCH_URL: http://elasticsearch:9200
    volumes:
      - ./infrastructure/elasticsearch/init.sh:/init/init.sh:ro
      - ./infrastructure/elasticsearch/businesses.v1.json:/mappings/businesses.v1.json:ro
    depends_on:
      elasticsearch: { condition: service_healthy }

  s3-init:
    <<: *oneshot
    image: amazon/aws-cli:2.37.6
    entrypoint: ['/bin/sh', '/init/init.sh']
    environment:
      S3_ENDPOINT: http://s3:9000
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: us-east-1
    volumes: [./infrastructure/s3/init.sh:/init/init.sh:ro]
    depends_on:
      s3: { condition: service_started }

  # ═════════════════════════════ MICROSERVICES ═════════════════════════════
  # Not published to the host: reach them through Kong (:8000). For direct
  # debugging use `docker compose exec <svc> ...` or temporarily add a port.

  auth-service:
    <<: [*infra, *node-image, *node-hardening]
    working_dir: /app/services/auth
    command: ['/app/node_modules/.bin/tsx', 'watch', '--clear-screen=false', 'src/index.ts']
    environment:
      <<: [*service-env, *s3-env]
      SERVICE_NAME: auth-service
      PORT: '3001'
      REDIS_URL: redis://:${VALKEY_PASSWORD}@valkey:6379/0
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:?run pnpm bootstrap}
      # Local development only: sign in as any email without Google
      # (POST /v1/auth/dev/login). auth-service refuses this in production.
      AUTH_DEV_LOGIN_ENABLED: 'true'
      GOOGLE_CLIENT_IDS: ${GOOGLE_CLIENT_IDS:-}
      APPLE_SIGN_IN_ENABLED: 'false'
      PII_ENCRYPTION_KEYS: ${PII_ENCRYPTION_KEYS}
      PII_ENCRYPTION_ACTIVE_KEY_ID: ${PII_ENCRYPTION_ACTIVE_KEY_ID:-k1}
      PII_BLIND_INDEX_KEY: ${PII_BLIND_INDEX_KEY}
    volumes:
      - ./packages/common/src:/app/packages/common/src:ro
      - ./packages/database/src:/app/packages/database/src:ro
      - ./packages/database/prisma:/app/packages/database/prisma:ro
      - ./packages/kafka/src:/app/packages/kafka/src:ro
      - ./packages/media/src:/app/packages/media/src:ro
      - ./packages/billing/src:/app/packages/billing/src:ro
      - ./services/auth/src:/app/services/auth/src:ro
    depends_on:
      <<: *needs-core
      valkey: { condition: service_healthy }
      s3-init: { condition: service_completed_successfully }
    healthcheck:
      <<: *node-healthcheck
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3001/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
    deploy: { resources: { limits: { memory: 384m } } }

  booking-service:
    <<: [*infra, *node-image, *node-hardening]
    working_dir: /app/services/booking
    command: ['/app/node_modules/.bin/tsx', 'watch', '--clear-screen=false', 'src/index.ts']
    environment:
      <<: [*service-env, *s3-env]
      SERVICE_NAME: booking-service
      PORT: '3002'
      REDIS_URL: redis://:${VALKEY_PASSWORD}@valkey:6379/0
    volumes:
      - ./packages/common/src:/app/packages/common/src:ro
      - ./packages/database/src:/app/packages/database/src:ro
      - ./packages/database/prisma:/app/packages/database/prisma:ro
      - ./packages/kafka/src:/app/packages/kafka/src:ro
      - ./packages/media/src:/app/packages/media/src:ro
      - ./packages/billing/src:/app/packages/billing/src:ro
      - ./services/booking/src:/app/services/booking/src:ro
    depends_on:
      <<: *needs-core
      valkey: { condition: service_healthy }
    healthcheck:
      <<: *node-healthcheck
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3002/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
    deploy: { resources: { limits: { memory: 384m } } }

  queue-service:
    <<: [*infra, *node-image, *node-hardening]
    working_dir: /app/services/queue
    command: ['/app/node_modules/.bin/tsx', 'watch', '--clear-screen=false', 'src/index.ts']
    environment:
      <<: *service-env
      SERVICE_NAME: queue-service
      PORT: '3003'
      REDIS_URL: redis://:${VALKEY_PASSWORD}@valkey:6379/0
    volumes:
      - ./packages/common/src:/app/packages/common/src:ro
      - ./packages/database/src:/app/packages/database/src:ro
      - ./packages/database/prisma:/app/packages/database/prisma:ro
      - ./packages/kafka/src:/app/packages/kafka/src:ro
      - ./packages/billing/src:/app/packages/billing/src:ro
      - ./services/queue/src:/app/services/queue/src:ro
    depends_on:
      <<: *needs-core
      valkey: { condition: service_healthy }
    healthcheck:
      <<: *node-healthcheck
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3003/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
    deploy: { resources: { limits: { memory: 384m } } }

  notification-service:
    <<: [*infra, *node-image, *node-hardening]
    working_dir: /app/services/notification
    command: ['/app/node_modules/.bin/tsx', 'watch', '--clear-screen=false', 'src/index.ts']
    environment:
      <<: *service-env
      SERVICE_NAME: notification-service
      PORT: '3004'
      REDIS_URL: redis://:${VALKEY_PASSWORD}@valkey:6379/0
      SMTP_HOST: mailpit
      SMTP_PORT: '1025'
      EMAIL_FROM: 'BUKU <noreply@buku.app>'
      PII_ENCRYPTION_KEYS: ${PII_ENCRYPTION_KEYS}
      PII_ENCRYPTION_ACTIVE_KEY_ID: ${PII_ENCRYPTION_ACTIVE_KEY_ID:-k1}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_CLIENT_EMAIL: ${FIREBASE_CLIENT_EMAIL:-}
      FIREBASE_PRIVATE_KEY: ${FIREBASE_PRIVATE_KEY:-}
    volumes:
      - ./packages/common/src:/app/packages/common/src:ro
      - ./packages/database/src:/app/packages/database/src:ro
      - ./packages/database/prisma:/app/packages/database/prisma:ro
      - ./packages/kafka/src:/app/packages/kafka/src:ro
      - ./services/notification/src:/app/services/notification/src:ro
    depends_on:
      <<: *needs-core
      valkey: { condition: service_healthy }
      mailpit: { condition: service_started }
    healthcheck:
      <<: *node-healthcheck
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3004/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
    deploy: { resources: { limits: { memory: 384m } } }

  business-service:
    <<: [*infra, *node-image, *node-hardening]
    working_dir: /app/services/business
    command: ['/app/node_modules/.bin/tsx', 'watch', '--clear-screen=false', 'src/index.ts']
    environment:
      <<: [*service-env, *s3-env]
      SERVICE_NAME: business-service
      PORT: '3008'
      REDIS_URL: redis://:${VALKEY_PASSWORD}@valkey:6379/0
      BUSINESS_TERMS_VERSION: '1.0'
      MAX_BUSINESSES_PER_OWNER: '5'
      PII_ENCRYPTION_KEYS: ${PII_ENCRYPTION_KEYS}
      PII_ENCRYPTION_ACTIVE_KEY_ID: ${PII_ENCRYPTION_ACTIVE_KEY_ID:-k1}
      PII_BLIND_INDEX_KEY: ${PII_BLIND_INDEX_KEY}
      S3_BUCKET_DOCUMENTS: buku-documents-dev
    volumes:
      - ./packages/common/src:/app/packages/common/src:ro
      - ./packages/database/src:/app/packages/database/src:ro
      - ./packages/database/prisma:/app/packages/database/prisma:ro
      - ./packages/kafka/src:/app/packages/kafka/src:ro
      - ./packages/media/src:/app/packages/media/src:ro
      - ./packages/billing/src:/app/packages/billing/src:ro
      - ./services/business/src:/app/services/business/src:ro
    depends_on:
      <<: *needs-core
      valkey: { condition: service_healthy }
      s3-init: { condition: service_completed_successfully }
    healthcheck:
      <<: *node-healthcheck
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3008/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
    deploy: { resources: { limits: { memory: 384m } } }

  billing-service:
    <<: [*infra, *node-image, *node-hardening]
    working_dir: /app/services/billing
    command: ['/app/node_modules/.bin/tsx', 'watch', '--clear-screen=false', 'src/index.ts']
    environment:
      <<: *service-env
      SERVICE_NAME: billing-service
      PORT: '3009'
      REDIS_URL: redis://:${VALKEY_PASSWORD}@valkey:6379/0
      # Online checkout (Paddle sandbox). Empty → checkout unavailable, everything else works.
      PADDLE_ENVIRONMENT: ${PADDLE_ENVIRONMENT:-sandbox}
      PADDLE_API_KEY: ${PADDLE_API_KEY:-}
      PADDLE_CLIENT_TOKEN: ${PADDLE_CLIENT_TOKEN:-}
      PADDLE_WEBHOOK_SECRET: ${PADDLE_WEBHOOK_SECRET:-}
    volumes:
      - ./packages/common/src:/app/packages/common/src:ro
      - ./packages/database/src:/app/packages/database/src:ro
      - ./packages/database/prisma:/app/packages/database/prisma:ro
      - ./packages/billing/src:/app/packages/billing/src:ro
      - ./services/billing/src:/app/services/billing/src:ro
    depends_on:
      <<: *needs-core
      valkey: { condition: service_healthy }
    healthcheck:
      <<: *node-healthcheck
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3009/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
    deploy: { resources: { limits: { memory: 256m } } }

  search-service:
    <<: [*infra, *node-image, *node-hardening]
    working_dir: /app/services/search
    command: ['/app/node_modules/.bin/tsx', 'watch', '--clear-screen=false', 'src/index.ts']
    environment:
      <<: *service-env
      SERVICE_NAME: search-service
      PORT: '3005'
      # MVP: Postgres full-text + PostGIS. Set to `elasticsearch` (and start the
      # stack with --profile elasticsearch) to switch engines.
      SEARCH_ENGINE: postgres
      ELASTICSEARCH_URL: http://elasticsearch:9200
      ELASTICSEARCH_INDEX_BUSINESSES: businesses
    volumes:
      - ./packages/common/src:/app/packages/common/src:ro
      - ./packages/database/src:/app/packages/database/src:ro
      - ./packages/database/prisma:/app/packages/database/prisma:ro
      - ./packages/kafka/src:/app/packages/kafka/src:ro
      - ./services/search/src:/app/services/search/src:ro
    depends_on:
      <<: *needs-core
    healthcheck:
      <<: *node-healthcheck
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3005/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
    deploy: { resources: { limits: { memory: 384m } } }

  ads-service:
    profiles: [ads]
    <<: [*infra, *node-image, *node-hardening]
    working_dir: /app/services/ads
    command: ['/app/node_modules/.bin/tsx', 'watch', '--clear-screen=false', 'src/index.ts']
    environment:
      <<: *service-env
      SERVICE_NAME: ads-service
      PORT: '3006'
      REDIS_URL: redis://:${VALKEY_PASSWORD}@valkey:6379/0
      AD_ATTRIBUTION_WINDOW_DAYS: '7'
    volumes:
      - ./packages/common/src:/app/packages/common/src:ro
      - ./packages/database/src:/app/packages/database/src:ro
      - ./packages/database/prisma:/app/packages/database/prisma:ro
      - ./packages/kafka/src:/app/packages/kafka/src:ro
      - ./services/ads/src:/app/services/ads/src:ro
    depends_on:
      <<: *needs-core
      valkey: { condition: service_healthy }
    healthcheck:
      <<: *node-healthcheck
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3006/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
    deploy: { resources: { limits: { memory: 384m } } }

  analytics-service:
    profiles: [analytics]
    <<: [*infra, *node-image, *node-hardening]
    working_dir: /app/services/analytics
    command: ['/app/node_modules/.bin/tsx', 'watch', '--clear-screen=false', 'src/index.ts']
    environment:
      <<: *service-env
      SERVICE_NAME: analytics-service
      PORT: '3007'
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: buku_analytics
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DATABASE: buku_analytics
    volumes:
      - ./packages/common/src:/app/packages/common/src:ro
      - ./packages/database/src:/app/packages/database/src:ro
      - ./packages/database/prisma:/app/packages/database/prisma:ro
      - ./packages/kafka/src:/app/packages/kafka/src:ro
      - ./services/analytics/src:/app/services/analytics/src:ro
    depends_on:
      clickhouse: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }
    healthcheck:
      <<: *node-healthcheck
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3007/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
    deploy: { resources: { limits: { memory: 384m } } }

  # ═════════════════════════════ API GATEWAY ═════════════════════════════

  kong:
    <<: *infra
    image: kong:3.9.3
    environment:
      KONG_DATABASE: 'off'
      KONG_DECLARATIVE_CONFIG: /tmp/kong.yml
      # Public key(s) for the gateway's access-token check (render-config.sh).
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      JWT_KEY_ID: ${JWT_KEY_ID}
      JWT_PREVIOUS_PUBLIC_KEY: ${JWT_PREVIOUS_PUBLIC_KEY:-}
      JWT_PREVIOUS_KEY_ID: ${JWT_PREVIOUS_KEY_ID:-}
      KONG_PROXY_LISTEN: '0.0.0.0:8000'
      # Admin API: dev convenience only, localhost-bound. Disabled in prod.
      KONG_ADMIN_LISTEN: '0.0.0.0:8001'
      KONG_STATUS_LISTEN: '0.0.0.0:8100'
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      # Don't advertise the gateway product/version in response headers.
      KONG_HEADERS: 'off'
      KONG_NGINX_PROXY_SERVER_TOKENS: 'off'
      KONG_REDIS_PASSWORD: ${VALKEY_PASSWORD}
      # Re-resolve service hostnames every 5s. Docker DNS answers carry a long
      # TTL; without this Kong keeps routing to a replaced container's old IP
      # (504s after every service restart or deploy).
      KONG_DNS_VALID_TTL: '5'
    entrypoint: ['/bin/sh', '/kong/render-config.sh']
    volumes:
      - ./infrastructure/kong/kong.template.yml:/kong/kong.template.yml:ro
      - ./infrastructure/kong/render-config.sh:/kong/render-config.sh:ro
    ports: ['127.0.0.1:8000:8000', '127.0.0.1:8001:8001']
    depends_on:
      valkey: { condition: service_healthy }
      auth-service: { condition: service_healthy }
      booking-service: { condition: service_healthy }
      business-service: { condition: service_healthy }
      billing-service: { condition: service_healthy }
      queue-service: { condition: service_healthy }
      notification-service: { condition: service_healthy }
      search-service: { condition: service_healthy }
      # ads-service / analytics-service are opt-in profiles (deferred features);
      # their routes answer 503 until those profiles are started.
    healthcheck:
      test: ['CMD', 'kong', 'health']
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 15s
    deploy: { resources: { limits: { memory: 512m } } }

  # ═════════════════════════════ OPTIONAL TOOLS (--profile tools) ═════════════════════════════

  kibana:
    <<: *infra
    profiles: [elasticsearch]
    image: docker.elastic.co/kibana/kibana:9.5.3
    environment:
      ELASTICSEARCH_HOSTS: '["http://elasticsearch:9200"]'
    ports: ['127.0.0.1:5601:5601']
    depends_on:
      elasticsearch: { condition: service_healthy }
    deploy: { resources: { limits: { memory: 1g } } }

  kafka-ui:
    <<: *infra
    profiles: [tools]
    image: kafbat/kafka-ui:v1.5.0
    environment:
      KAFKA_CLUSTERS_0_NAME: buku-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      DYNAMIC_CONFIG_ENABLED: 'false'
    ports: ['127.0.0.1:8080:8080']
    depends_on:
      kafka: { condition: service_healthy }
    deploy: { resources: { limits: { memory: 512m } } }

  redis-insight:
    <<: *infra
    profiles: [tools]
    image: redis/redisinsight:3.8.0
    ports: ['127.0.0.1:5540:5540']
    depends_on:
      valkey: { condition: service_healthy }
    deploy: { resources: { limits: { memory: 256m } } }
