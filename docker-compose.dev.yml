# ═══════════════════════════════════════════════════════════════════════════
# BUKU — local development stack
#
#   pnpm bootstrap       # once: generates .env secrets, installs deps
#   pnpm dev             # start (first run builds images: a few minutes)
#   pnpm dev:tools       # + Kibana, Kafka UI, Redis Insight (needs more RAM)
#   pnpm health          # ✔/✘ for every component
#   pnpm dev:down        # stop   ·   pnpm dev:wipe  # stop + delete all data
#
# Security posture, even in dev (so dev mirrors prod):
#   • No secret is written in this file; all come from .env (git-ignored).
#   • Every published port binds to 127.0.0.1 only — nothing is reachable
#     from your network. Services are NOT published at all: the only way in
#     is the Kong gateway on :8000, exactly like production.
#   • Each service receives only the secrets it needs (only auth-service
#     gets the JWT private key; nobody but Postgres gets the superuser pw).
#   • Node containers run as non-root, read-only root filesystem, all Linux
#     capabilities dropped, no privilege escalation.
#
# Endpoints (host):
#   API gateway   http://localhost:8000        (Kong admin: inside its container only, D-092)
#   Mailpit UI    http://localhost:8025        S3 console   http://localhost:9101
#   Postgres      localhost:5432               Valkey       localhost:6379
#   Kafka         localhost:9092               Elasticsearch http://localhost:9200
#   ClickHouse    http://localhost:8123        S3 API       http://localhost:9100
#   --profile tools: Kibana :5601 · Kafka UI :8080 · Redis Insight :5540
# ═══════════════════════════════════════════════════════════════════════════

name: buku

# ── Networks: each service sees only what it needs (D-092) ─────────────────
# Every service has a network of its own, shared only with the data stores it
# uses and with Kong (its one way in). Services can't reach each other: a
# compromised service can't call another's internal port, and the only route
# between them is the public gateway, with its checks. Networks marked internal
# have no way out to the internet: services that never call outside can't send
# anything out either. Containers with host ports also join "published".
networks:
  published: {}
  kong-cache: { internal: true }
  migrate: { internal: true }
  kafka-admin: { internal: true }
  s3-admin: { internal: true }
  es-admin: { internal: true }
  tools: {}
  # Outside calls needed: Google sign-in and leaked-password checks (auth),
  # email/push/WhatsApp (notification), Paddle (billing).
  svc-auth: {}
  svc-notification: {}
  svc-billing: {}
  svc-booking: { internal: true }
  svc-queue: { internal: true }
  svc-business: { internal: true }
  svc-search: { internal: true }
  svc-ads: { internal: true }
  svc-analytics: { internal: true }

volumes:
  postgres-data:
  valkey-data:
  kafka-data:
  kafka-access-state:
  elasticsearch-data:
  clickhouse-data:
  s3-data:

# ── Shared building blocks ─────────────────────────────────────────────────
x-logging: &logging
  driver: json-file
  options: { max-size: '10m', max-file: '3' }

x-infra: &infra
  restart: unless-stopped
  logging: *logging

x-oneshot: &oneshot
  restart: 'no'
  logging: *logging

# One image for every Node workload, built once from docker/node/Dockerfile.dev.
x-node-image: &node-image
  image: buku/node-dev:local
  build:
    context: .
    dockerfile: docker/node/Dockerfile.dev

x-node-hardening: &node-hardening
  user: node
  init: true # tini as PID 1: forwards SIGTERM for graceful shutdown, reaps zombies
  read_only: true
  tmpfs: ['/tmp:size=64m']
  cap_drop: [ALL]
  security_opt: ['no-new-privileges:true']

# Source is mounted READ-ONLY for hot reload; dependencies stay in the image.
x-shared-src: &shared-src # used by db-migrate
  - ./packages/common/src:/app/packages/common/src:ro
  - ./packages/validation/src:/app/packages/validation/src:ro
  - ./packages/database/src:/app/packages/database/src:ro
  - ./packages/database/prisma:/app/packages/database/prisma:ro
  - ./packages/kafka/src:/app/packages/kafka/src:ro

x-service-env: &service-env
  NODE_ENV: development
  LOG_LEVEL: ${LOG_LEVEL:-info}
  LOG_PRETTY: 'true'
  TRUST_PROXY_HOPS: '1'
  KAFKA_BROKERS: kafka:29092
  # Each service signs in as its own Kafka user (D-092; infrastructure/kafka/access.conf).
  KAFKA_SASL_MECHANISM: scram-sha-512
  JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?run pnpm bootstrap}
  JWT_KEY_ID: ${JWT_KEY_ID:?run pnpm bootstrap}
  JWT_ISSUER: ${JWT_ISSUER:-https://auth.buku.local}
  JWT_AUDIENCE: ${JWT_AUDIENCE:-buku-api}
  DATABASE_URL: postgresql://buku_app:${BUKU_APP_PASSWORD:?run pnpm bootstrap}@postgres:5432/buku
  DATABASE_POOL_SIZE: '5'

# Object storage: for services that store files (business, auth) or link to them (search).
x-s3-env: &s3-env
  S3_ENDPOINT: http://s3:9000
  # Presigned links must point at an address the BROWSER can reach.
  S3_PUBLIC_ENDPOINT: http://localhost:9100
  S3_REGION: us-east-1
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
  S3_FORCE_PATH_STYLE: 'true'
  S3_BUCKET_MEDIA: buku-media-dev
  S3_BUCKET_PRIVATE: buku-private-dev

x-node-healthcheck: &node-healthcheck
  interval: 10s
  timeout: 5s
  retries: 12
  start_period: 30s

x-needs-core: &needs-core
  postgres: { condition: service_healthy }
  kafka-init: { condition: service_completed_successfully }
  db-migrate: { condition: service_completed_successfully }
  db-access: { condition: service_completed_successfully }

services:
  # ═════════════════════════════ DATA STORES ═════════════════════════════

  postgres:
    <<: *infra
    networks:
      [
        published,
        migrate,
        svc-auth,
        svc-booking,
        svc-queue,
        svc-notification,
        svc-business,
        svc-billing,
        svc-search,
        svc-ads,
        svc-analytics,
      ]
    build: { context: docker/postgres }
    image: buku/postgres:local
    shm_size: 256mb
    environment:
      POSTGRES_USER: buku_admin
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?run pnpm bootstrap}
      POSTGRES_DB: buku
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C.UTF-8 --data-checksums'
      BUKU_MIGRATOR_PASSWORD: ${BUKU_MIGRATOR_PASSWORD:?run pnpm bootstrap}
      BUKU_APP_PASSWORD: ${BUKU_APP_PASSWORD:?run pnpm bootstrap}
    command: >
      postgres
        -c shared_buffers=256MB
        -c effective_cache_size=768MB
        -c work_mem=8MB
        -c maintenance_work_mem=128MB
        -c max_connections=150
        -c password_encryption=scram-sha-256
        -c log_min_duration_statement=500
        -c log_lock_waits=on
        -c idle_in_transaction_session_timeout=60s
        -c shared_preload_libraries=pg_stat_statements
    volumes: [postgres-data:/var/lib/postgresql/data]
    ports: ['127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U buku_admin -d buku -q']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    deploy: { resources: { limits: { memory: 1g } } }

  valkey:
    <<: *infra
    networks:
      [
        published,
        kong-cache,
        tools,
        svc-auth,
        svc-booking,
        svc-queue,
        svc-notification,
        svc-business,
        svc-billing,
        svc-ads,
      ]
    image: valkey/valkey:8.1.4-alpine
    # noeviction: this instance holds booking locks, queue state and BullMQ
    # jobs. An LRU policy would silently DELETE them under memory pressure.
    # Each service signs in as its own user, limited to its own keys (D-092;
    # infrastructure/valkey/access.acl). The default user is the admin.
    entrypoint: ['/bin/sh', '/access/start.sh']
    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:?run pnpm bootstrap}
      REDISCLI_AUTH: ${VALKEY_PASSWORD}
      VALKEY_PASSWORD_AUTH: ${VALKEY_PASSWORD_AUTH:?run pnpm bootstrap}
      VALKEY_PASSWORD_BOOKING: ${VALKEY_PASSWORD_BOOKING:?run pnpm bootstrap}
      VALKEY_PASSWORD_QUEUE: ${VALKEY_PASSWORD_QUEUE:?run pnpm bootstrap}
      VALKEY_PASSWORD_NOTIFICATION: ${VALKEY_PASSWORD_NOTIFICATION:?run pnpm bootstrap}
      VALKEY_PASSWORD_BUSINESS: ${VALKEY_PASSWORD_BUSINESS:?run pnpm bootstrap}
      VALKEY_PASSWORD_BILLING: ${VALKEY_PASSWORD_BILLING:?run pnpm bootstrap}
      VALKEY_PASSWORD_ADS: ${VALKEY_PASSWORD_ADS:?run pnpm bootstrap}
      VALKEY_PASSWORD_KONG: ${VALKEY_PASSWORD_KONG:?run pnpm bootstrap}
    volumes: [valkey-data:/data, ./infrastructure/valkey:/access:ro]
    ports: ['127.0.0.1:6379:6379']
    healthcheck:
      test: ['CMD-SHELL', 'valkey-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 20
    deploy: { resources: { limits: { memory: 512m } } }

  kafka:
    <<: *infra
    networks:
      [
        published,
        kafka-admin,
        tools,
        svc-auth,
        svc-booking,
        svc-queue,
        svc-notification,
        svc-business,
        svc-search,
        svc-ads,
        svc-analytics,
      ]
    image: apache/kafka:4.3.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # Signing in (D-092): services and jobs (INTERNAL) and this machine (EXTERNAL) sign in
      # with SCRAM-SHA-512, each as its own user, allowed only what
      # infrastructure/kafka/access.conf lists (the kafka-access job applies it). The controller
      # and LOCAL listeners need no password and are bound to 127.0.0.1 inside this container:
      # only the broker itself, its health check and the kafka-access job (which shares this
      # container's network) reach them.
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@127.0.0.1:9093
      KAFKA_LISTENERS: CONTROLLER://127.0.0.1:9093,LOCAL://127.0.0.1:29093,INTERNAL://:29092,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: LOCAL://127.0.0.1:29093,INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,LOCAL:PLAINTEXT,INTERNAL:SASL_PLAINTEXT,EXTERNAL:SASL_PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: LOCAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_SASL_ENABLED_MECHANISMS: SCRAM-SHA-512
      KAFKA_LISTENER_NAME_INTERNAL_SCRAM___SHA___512_SASL_JAAS_CONFIG: org.apache.kafka.common.security.scram.ScramLoginModule required;
      KAFKA_LISTENER_NAME_EXTERNAL_SCRAM___SHA___512_SASL_JAAS_CONFIG: org.apache.kafka.common.security.scram.ScramLoginModule required;
      KAFKA_AUTHORIZER_CLASS_NAME: org.apache.kafka.metadata.authorizer.StandardAuthorizer
      KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND: 'false'
      # The password-less local listeners (the broker itself, the kafka-access job) and the admin.
      KAFKA_SUPER_USERS: User:ANONYMOUS;User:buku-admin
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # Topics are created explicitly from the registry — a typo in a topic
      # name must fail loudly, not silently create a new empty topic.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: '-Xms384m -Xmx384m'
      # 22-char base64 UUID; regenerate with: bash scripts/generate-cluster-id.sh
      CLUSTER_ID: cjrnsqVhRfiYZARrnNIQdw
    volumes: [kafka-data:/var/lib/kafka/data]
    ports: ['127.0.0.1:9092:9092']
    healthcheck:
      test:
        [
          'CMD-SHELL',
          '/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server 127.0.0.1:29093 > /dev/null 2>&1',
        ]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s
    deploy: { resources: { limits: { memory: 1g } } }

  elasticsearch:
    profiles: [elasticsearch]
    networks: [published, es-admin, tools, svc-search]
    <<: *infra
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.3
    environment:
      discovery.type: single-node
      cluster.name: buku-local
      # DEV ONLY: security off on a private network bound to localhost.
      # Production MUST enable xpack security + TLS (docs/SECURITY.md).
      xpack.security.enabled: 'false'
      xpack.ml.enabled: 'false'
      action.destructive_requires_name: 'true'
      ES_JAVA_OPTS: '-Xms512m -Xmx512m'
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    volumes: [elasticsearch-data:/usr/share/elasticsearch/data]
    ports: ['127.0.0.1:9200:9200']
    healthcheck:
      test:
        [
          'CMD-SHELL',
          "curl -sf 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' > /dev/null",
        ]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 40s
    deploy: { resources: { limits: { memory: 1280m } } }

  clickhouse:
    profiles: [analytics]
    networks: [published, svc-analytics]
    <<: *infra
    image: clickhouse/clickhouse-server:26.3.36-alpine
    environment:
      CLICKHOUSE_DB: buku_analytics
      CLICKHOUSE_USER: buku_analytics
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?run pnpm bootstrap}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: '0'
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./infrastructure/clickhouse/init:/docker-entrypoint-initdb.d:ro
    ports: ['127.0.0.1:8123:8123']
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:8123/ping | grep -q Ok']
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    deploy: { resources: { limits: { memory: 1g } } }

  # S3-compatible object storage (production: DigitalOcean Spaces).
  s3:
    <<: *infra
    networks: [published, s3-admin, svc-auth, svc-booking, svc-business, svc-search]
    image: rustfs/rustfs:1.0.0
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY_ID:?run pnpm bootstrap}
      RUSTFS_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:?run pnpm bootstrap}
      RUSTFS_ADDRESS: ':9000'
      RUSTFS_CONSOLE_ENABLE: 'true'
      RUSTFS_CONSOLE_ADDRESS: ':9001'
      RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS: http://localhost:9101
    volumes: [s3-data:/data]
    ports: ['127.0.0.1:9100:9000', '127.0.0.1:9101:9001']
    deploy: { resources: { limits: { memory: 512m } } }

  # Catches every outgoing email in dev (production: AWS SES via SMTP).
  mailpit:
    <<: *infra
    networks: [published, svc-notification]
    image: axllent/mailpit:v1.31.3
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 'true'
      MP_SMTP_AUTH_ALLOW_INSECURE: 'true'
      MP_MAX_MESSAGES: 2000
    ports: ['127.0.0.1:8025:8025', '127.0.0.1:1025:1025']
    deploy: { resources: { limits: { memory: 128m } } }

  # ═════════════════════════════ ONE-SHOT SETUP JOBS ═════════════════════════════

  # Kafka's users and their permissions (D-092; infrastructure/kafka/access.conf). Runs in the
  # broker's own network namespace, so it reaches the password-less local listener.
  kafka-access:
    <<: *oneshot
    image: apache/kafka:4.3.1
    network_mode: service:kafka
    entrypoint: ['bash', '/access/apply-access.sh']
    environment:
      KAFKA_PASSWORD_ADMIN: ${KAFKA_PASSWORD_ADMIN:?run pnpm bootstrap}
      KAFKA_PASSWORD_TOOLS: ${KAFKA_PASSWORD_TOOLS:?run pnpm bootstrap}
      KAFKA_PASSWORD_AUTH: ${KAFKA_PASSWORD_AUTH:?run pnpm bootstrap}
      KAFKA_PASSWORD_BOOKING: ${KAFKA_PASSWORD_BOOKING:?run pnpm bootstrap}
      KAFKA_PASSWORD_QUEUE: ${KAFKA_PASSWORD_QUEUE:?run pnpm bootstrap}
      KAFKA_PASSWORD_NOTIFICATION: ${KAFKA_PASSWORD_NOTIFICATION:?run pnpm bootstrap}
      KAFKA_PASSWORD_BUSINESS: ${KAFKA_PASSWORD_BUSINESS:?run pnpm bootstrap}
      KAFKA_PASSWORD_SEARCH: ${KAFKA_PASSWORD_SEARCH:?run pnpm bootstrap}
      KAFKA_PASSWORD_ADS: ${KAFKA_PASSWORD_ADS:?run pnpm bootstrap}
      KAFKA_PASSWORD_ANALYTICS: ${KAFKA_PASSWORD_ANALYTICS:?run pnpm bootstrap}
    volumes:
      - ./infrastructure/kafka:/access:ro
      # What was applied last (a fingerprint), so an unchanged plan isn't applied again.
      - kafka-access-state:/home/appuser
    depends_on:
      kafka: { condition: service_healthy }

  kafka-init:
    <<: [*oneshot, *node-image, *node-hardening]
    networks: [kafka-admin]
    working_dir: /app/packages/kafka
    command: ['/app/node_modules/.bin/tsx', 'scripts/sync-topics.ts']
    environment:
      KAFKA_BROKERS: kafka:29092
      KAFKA_SASL_MECHANISM: scram-sha-512
      KAFKA_SASL_USERNAME: buku-admin
      KAFKA_SASL_PASSWORD: ${KAFKA_PASSWORD_ADMIN:?run pnpm bootstrap}
      KAFKA_REPLICATION_FACTOR: '1'
      KAFKA_MIN_INSYNC_REPLICAS: '1'
    volumes:
      [
        ./packages/kafka/src:/app/packages/kafka/src:ro,
        ./packages/kafka/scripts:/app/packages/kafka/scripts:ro,
      ]
    depends_on:
      kafka-access: { condition: service_completed_successfully }

  db-migrate:
    <<: [*oneshot, *node-image, *node-hardening]
    networks: [migrate]
    working_dir: /app/packages/database
    command:
      ['sh', '-c', 'node_modules/.bin/prisma migrate deploy && /app/node_modules/.bin/tsx prisma/seed.ts']
    environment:
      NODE_ENV: development
      # Migrations run as the schema owner; the seed also uses PII keys to
      # encrypt demo users' contact details exactly like the real app will.
      DATABASE_MIGRATION_URL: postgresql://buku_migrator:${BUKU_MIGRATOR_PASSWORD}@postgres:5432/buku
      PII_ENCRYPTION_KEYS: ${PII_ENCRYPTION_KEYS:?run pnpm bootstrap}
      PII_ENCRYPTION_ACTIVE_KEY_ID: ${PII_ENCRYPTION_ACTIVE_KEY_ID:-k1}
      PII_BLIND_INDEX_KEY: ${PII_BLIND_INDEX_KEY:?run pnpm bootstrap}
    volumes: *shared-src
    depends_on:
      postgres: { condition: service_healthy }

  # Each service's own database role, with exactly its rights (D-092; packages/database/src/
  # access.ts). Runs after every migration, as the admin: roles, passwords, grants.
  db-access:
    <<: [*oneshot, *node-image, *node-hardening]
    networks: [migrate]
    working_dir: /app/packages/database
    command: ['/app/node_modules/.bin/tsx', 'scripts/apply-access.ts']
    environment:
      NODE_ENV: development
      DATABASE_ADMIN_URL: postgresql://buku_admin:${POSTGRES_SUPERUSER_PASSWORD:?run pnpm bootstrap}@postgres:5432/buku
      BUKU_DB_PASSWORD_AUTH: ${BUKU_DB_PASSWORD_AUTH:?run pnpm bootstrap}
      BUKU_DB_PASSWORD_BOOKING: ${BUKU_DB_PASSWORD_BOOKING:?run pnpm bootstrap}
      BUKU_DB_PASSWORD_QUEUE: ${BUKU_DB_PASSWORD_QUEUE:?run pnpm bootstrap}
      BUKU_DB_PASSWORD_NOTIFICATION: ${BUKU_DB_PASSWORD_NOTIFICATION:?run pnpm bootstrap}
      BUKU_DB_PASSWORD_BUSINESS: ${BUKU_DB_PASSWORD_BUSINESS:?run pnpm bootstrap}
      BUKU_DB_PASSWORD_BILLING: ${BUKU_DB_PASSWORD_BILLING:?run pnpm bootstrap}
      BUKU_DB_PASSWORD_SEARCH: ${BUKU_DB_PASSWORD_SEARCH:?run pnpm bootstrap}
      BUKU_DB_PASSWORD_ADS: ${BUKU_DB_PASSWORD_ADS:?run pnpm bootstrap}
      BUKU_DB_PASSWORD_ANALYTICS: ${BUKU_DB_PASSWORD_ANALYTICS:?run pnpm bootstrap}
    volumes:
      - ./packages/common/src:/app/packages/common/src:ro
      - ./packages/validation/src:/app/packages/validation/src:ro
      - ./packages/database/src:/app/packages/database/src:ro
      - ./packages/database/scripts:/app/packages/database/scripts:ro
    depends_on:
      db-migrate: { condition: service_completed_successfully }

  elasticsearch-init:
    profiles: [elasticsearch]
    networks: [es-admin]
    <<: *oneshot
    image: curlimages/curl:8.22.0
    user: curl_user
    entrypoint: ['/bin/sh', '/init/init.sh']
    environment:
      ELASTICSEARCH_URL: http://elasticsearch:9200
    volumes:
      - ./infrastructure/elasticsearch/init.sh:/init/init.sh:ro
      - ./infrastructure/elasticsearch/businesses.v1.json:/mappings/businesses.v1.json:ro
    depends_on:
      elasticsearch: { condition: service_healthy }

  s3-init:
    <<: *oneshot
    networks: [s3-admin]
    image: amazon/aws-cli:2.37.6
    entrypoint: ['/bin/sh', '/init/init.sh']
    environment:
      S3_ENDPOINT: http://s3:9000
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: us-east-1
    volumes: [./infrastructure/s3/init.sh:/init/init.sh:ro]
    depends_on:
      s3: { condition: service_started }

  # ═════════════════════════════ MICROSERVICES ═════════════════════════════
  # Not published to the host: reach them through Kong (:8000). For direct
  # debugging use `docker compose exec <svc> ...` or temporarily add a port.

  auth-service:
    <<: [*infra, *node-image, *node-hardening]
    networks: [svc-auth]
    working_dir: /app/services/auth
    command: ['/app/node_modules/.bin/tsx', 'watch', '--clear-screen=false', 'src/index.ts']
    environment:
      <<: [*service-env, *s3-env]
      # Its own database role (D-092): only what packages/database/src/access.ts allows.
      DATABASE_URL: postgresql://buku_svc_auth:${BUKU_DB_PASSWORD_AUTH:?run pnpm bootstrap}@postgres:5432/buku
      SERVICE_NAME: auth-service
      KAFKA_SASL_USERNAME: buku-auth
      KAFKA_SASL_PASSWORD: ${KAFKA_PASSWORD_AUTH:?run pnpm bootstrap}
      PORT: '3001'
      REDIS_URL: redis://buku-auth:${VALKEY_PASSWORD_AUTH:?run pnpm bootstrap}@valkey:6379/0
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:?run pnpm bootstrap}
      # Local development only: sign in as any email without Google
      # (POST /v1/auth/dev/login). auth-service refuses this in production.
      AUTH_DEV_LOGIN_ENABLED: 'true'
