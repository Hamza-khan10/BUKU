# pgBackRest (docs/DATABASE.md DB-030, DB-033): continuous WAL archiving and backups of this
# server. Development keeps the repository on a Docker volume; production points repo1 at two
# object stores in two regions (the second with object lock). The repository is encrypted: its
# passphrase comes from the environment (PGBACKREST_REPO1_CIPHER_PASS), never from this file.
[global]
repo1-path=/var/lib/pgbackrest
repo1-cipher-type=aes-256-cbc
# Development keeps two full backups (and their differentials); production keeps 35 days of
# point-in-time recovery and monthly copies for a year.
repo1-retention-full=2
repo1-retention-diff=6
compress-type=zst
start-fast=y
process-max=2
log-level-console=info
log-level-file=off

[buku]
pg1-path=/var/lib/postgresql/data
pg1-socket-path=/var/run/postgresql
pg1-user=buku_admin
