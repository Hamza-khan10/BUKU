# Who may connect, and how (docs/DATABASE.md DB-020). Read through hba_file, so every server made
# from this image enforces it, including ones whose data directory predates it.
#
# TYPE    DATABASE  USER  ADDRESS  METHOD
# The server's own socket, inside its container: the administrator's tools (pgBackRest, psql).
local     all       all            trust
# Every network connection: TLS (1.3, ssl_min_protocol_version), then the role's password. There is
# no plain "host" line, so a connection without TLS is refused.
hostssl   all       all   all      scram-sha-256
