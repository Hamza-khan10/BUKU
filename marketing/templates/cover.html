<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  /* Wide covers (Facebook 1640x624, X 1500x500): everything sized from the height. */
  body { background: var(--midnight); color: #edf3f0; position: relative; display: flex; align-items: center; padding: 0 9vh 0 12vh; }
  .glow { width: 150vh; height: 150vh; right: -30vh; top: -55vh; }
  .text { position: relative; display: flex; flex-direction: column; gap: 5vh; }
  .logo { height: 11vh; width: auto; align-self: flex-start; }
  .headline { font-size: 17vh; }
  .headline span { color: var(--mint); }
  .line { font-size: 5.6vh; color: #b4c4bc; }
  .url { position: absolute; right: 9vh; bottom: 8vh; font-size: 5vh; font-weight: 600; color: var(--mint); }
</style></head>
<body>
  <div class="glow"></div>
  <div class="text">
    <img class="logo" src="../brand/logos/buku-logo-horizontal-reversed.svg" alt="">
    <div class="headline">No one should wait<br><span>to be seen</span><i class="dot"></i></div>
    <div class="line">Bookings and walk-in queues, from your phone.</div>
  </div>
  <div class="url">onbuku.com</div>
</body></html>
