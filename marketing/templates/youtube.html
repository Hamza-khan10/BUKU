<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  /* YouTube banner 2560x1440: only the middle 1546x423 shows on every device. */
  body { background: var(--midnight); color: #edf3f0; position: relative; }
  .glow { width: 1400px; height: 1400px; right: 300px; top: -200px; }
  .safe { position: absolute; left: 507px; top: 508px; width: 1546px; height: 423px; display: flex; align-items: center; justify-content: space-between; padding: 0 40px; }
  .left { display: flex; flex-direction: column; gap: 26px; }
  .logo { height: 70px; width: auto; align-self: flex-start; }
  .headline { font-size: 104px; }
  .headline span { color: var(--mint); }
  .url { font-size: 38px; font-weight: 600; color: var(--mint); align-self: flex-end; padding-bottom: 30px; }
</style></head>
<body><div class="glow"></div>
  <div class="safe">
    <div class="left"><img class="logo" src="../brand/logos/buku-logo-horizontal-reversed.svg" alt="">
      <div class="headline">No one should wait <span>to be seen</span><i class="dot"></i></div></div>
    <div class="url">onbuku.com</div>
  </div>
</body></html>
