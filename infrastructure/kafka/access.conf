# Who may publish and read which Kafka topics (D-092).
#
# Each service signs in to Kafka as buku-<service> (password KAFKA_PASSWORD_<SERVICE>) and may
# publish only the topics on its "publishes" line and read only those on its "consumes" line,
# as its own consumer groups (buku-<service>-service-…). A service that consumes may also park
# a message it can't handle in dlq.failed-events. Nothing else is allowed: a service that is
# taken over can't forge another's events (a forged users.deleted would cancel someone's
# bookings) or read events it has no use for. Each kind of event has exactly one publisher.
#
# Applied by apply-access.sh (the kafka-access job). packages/kafka/test/access.test.ts checks
# it against the topic registry and the topics each service's code uses.
#
# service       what       topics

auth            publishes  users.registered users.deleted businesses.member_removed

booking         publishes  bookings.created bookings.confirmed bookings.cancelled bookings.rescheduled
booking         publishes  bookings.completed bookings.no_show reviews.created reviews.responded
booking         consumes   businesses.member_removed users.deleted

queue           publishes  queue.session.opened queue.session.closed queue.entry.joined queue.entry.called
queue           publishes  queue.entry.served queue.entry.completed queue.entry.left queue.entry.no_show
queue           publishes  queue.position.updated
queue           consumes   users.deleted

business        publishes  businesses.created businesses.updated businesses.verified businesses.suspended
business        consumes   businesses.member_removed

notification    consumes   bookings.created bookings.confirmed bookings.cancelled bookings.rescheduled
notification    consumes   bookings.no_show queue.position.updated queue.entry.called queue.entry.left
notification    consumes   reviews.created reviews.responded

search          publishes  analytics.search

# Not built yet: they sign in, and may publish and read nothing.
ads             publishes
analytics       publishes
