# ═══════════════════════════════════════════════════════════════════════════
# BUKU API gateway — Kong 3.9 (DB-less, declarative)  ·  TEMPLATE
#
# This file is rendered at container start by render-config.sh, which fills
# in the JWT public key(s) under `consumers` from the environment.
#
# The gateway is the ONLY public entry point to the services. It provides:
#   • routing by path to the owning service (services are never exposed)
#   • ACCESS-TOKEN CHECK: every route requires a valid, unexpired RS256 token
#     signed by our key — EXCEPT the public routes listed explicitly below
#     (deny by default). Forged/missing tokens never reach a service.
#   • CORS with an explicit origin allow-list (preflight answered here)
#   • coarse per-IP rate limits (counters in Valkey → consistent across
#     gateway replicas); services add precise per-user limits. "IP" is the
#     visitor's real address, also for calls the web app makes for them (D-084)
#   • request-size limits (uploads bypass the API via presigned S3 URLs)
#   • correlation ids (X-Request-ID) propagated to every service log line
#
# Services STILL verify tokens themselves (defense in depth) and also check
# revocation (logout / password change), which the gateway cannot see.
#
# /health, /ready and /metrics are deliberately NOT routed: they stay internal.
# ═══════════════════════════════════════════════════════════════════════════
_format_version: '3.0'
_transform: true

# The token issuer. Secrets are keyed by the token's `kid` header, so during a
# key rotation both the current and the previous public key are accepted.
consumers:
  - username: buku-auth-service
    jwt_secrets:
      # __JWT_SECRETS__

services:
  - name: auth-service
    url: http://auth-service:3001
    connect_timeout: 5000
    read_timeout: 30000
    write_timeout: 30000
    retries: 0 # never auto-retry non-idempotent auth calls
    plugins:
      - name: rate-limiting
        config:
          minute: 20
          limit_by: header
          header_name: X-BUKU-Client-IP
          policy: redis
          fault_tolerant: true
          hide_client_headers: false
          error_code: 429
          error_message: Too many authentication attempts, please wait a minute
          redis: &redis
            host: valkey
            port: 6379
            password: '{vault://env/kong-redis-password}'
            database: 1
            timeout: 2000
    routes:
      # Public: signing in and refreshing happen BEFORE the client has a valid access token.
      - name: auth-public
        paths:
          [
            '/v1/auth/oauth',
            '/v1/auth/business-login',
            '/v1/auth/dev',
            '/v1/auth/refresh',
            '/v1/auth/logout',
            '/v1/auth/mfa/verify',
          ]
        strip_path: false
      # Everything else under /v1/auth needs a token (longest prefix wins, so
      # /v1/auth/logout-all lands here, not on the public /v1/auth/logout).
      - name: auth-private
        paths: ['/v1/auth', '/v1/auth/logout-all', '/v1/admin/access-review']
        strip_path: false
        plugins:
          - &jwt
            name: jwt
            config:
              key_claim_name: kid # read from the token header
              claims_to_verify: [exp]
              maximum_expiration: 3600 # refuse tokens valid for more than 1h
              run_on_preflight: false # CORS preflight carries no token
              header_names: [authorization]
              uri_param_names: [] # never accept tokens in URLs (they end up in logs)
              cookie_names: []
      # A business's team (employee accounts, roles) lives in auth-service (D-044).
      - name: business-members
        paths: ['~/v1/businesses/[^/]+/members($|/)']
        regex_priority: 20
        strip_path: false
        plugins: [*jwt]

  - name: booking-service
    url: http://booking-service:3002
    connect_timeout: 5000
    read_timeout: 30000
    write_timeout: 30000
    retries: 0
    routes:
      # Public: browsing a business's services, staff and free slots.
      - name: business-booking-public
        paths: ['~/v1/businesses/[^/]+/(availability|services|staff|reviews)$']
        methods: [GET, OPTIONS]
        regex_priority: 10
        strip_path: false
      - name: booking-private
        paths:
          - '/v1/appointments'
          - '/v1/staff'
          - '/v1/admin/reviews'
          - '~/v1/businesses/[^/]+/(appointments|availability|services|service-categories|staff|closures|booking-settings|check-in|attendance|reviews|insights)($|/)'
        strip_path: false
        plugins: [*jwt]

  - name: billing-service
    url: http://billing-service:3009
    connect_timeout: 5000
    read_timeout: 30000
    write_timeout: 30000
    retries: 0
    routes:
      # Public: the pricing page.
      - name: billing-plans
        paths: ['/v1/billing/plans']
        methods: [GET, OPTIONS]
        strip_path: false
      # Paddle's notifications: no token, the signature is checked by billing-service.
      - name: billing-paddle-webhook
        paths: ['/v1/billing/webhooks/paddle']
        methods: [POST]
        strip_path: false
      - name: billing-private
        paths: ['/v1/billing', '/v1/admin/billing']
        strip_path: false
        plugins: [*jwt]
      # A business's plan and usage.
      - name: business-billing
        paths: ['~/v1/businesses/[^/]+/billing($|/)']
        regex_priority: 20
        strip_path: false
        plugins: [*jwt]

  - name: queue-service
    url: http://queue-service:3003
    retries: 0
    read_timeout: 60000 # > 15s live-stream heartbeat
    routes:
      # Public: whether a business has a queue and how long it is (ticket numbers only),
      # also as a live stream (Server-Sent Events): responses must pass through at once,
      # not be buffered by the gateway. Streams send a heartbeat every 15s, well inside
      # this service's read timeout.
      - name: queue-public
        paths: ['/v1/queue/public']
        methods: [GET, OPTIONS]
        strip_path: false
        response_buffering: false
      - name: queue
        paths: ['/v1/queue']
        strip_path: false
        plugins: [*jwt]
      # The front desk's queue screen and controls.
      - name: business-queue
        paths: ['~/v1/businesses/[^/]+/queue($|/)']
        regex_priority: 20
        strip_path: false
        plugins: [*jwt]

  - name: notification-service
    url: http://notification-service:3004
    routes:
      - name: notifications
        paths:
          [
            '/v1/notifications',
            '/v1/users/me/notification-prefs',
            '/v1/users/me/whatsapp',
            '/v1/admin/notifications',
          ]
        strip_path: false
        plugins: [*jwt]
      # Unsubscribe links in emails: no token, the link itself is signed.
      - name: notification-unsubscribe
        paths: ['/v1/notifications/unsubscribe']
        methods: [GET, POST]
        strip_path: false
      # Meta's WhatsApp webhook: no token, the signature is checked by notification-service.
      - name: whatsapp-webhook
        paths: ['/v1/webhooks/whatsapp']
        methods: [GET, POST]
        strip_path: false

  - name: search-service
    url: http://search-service:3005
    plugins:
      - name: rate-limiting
        config:
          minute: 200
          limit_by: header
          header_name: X-BUKU-Client-IP
          policy: redis
          fault_tolerant: true
          error_code: 429
          error_message: Too many search requests, please slow down
          redis: *redis
    routes:
      # Public: discovery works without signing in. Explicit regex priority so
      # these win over the business public-profile route /v1/businesses/{slug}.
      - name: search
        paths: ['~/v1/businesses/(search|nearby|autocomplete|featured|trending)$', '/v1/categories']
        methods: [GET, OPTIONS]
        regex_priority: 20
        strip_path: false

  - name: business-service
    url: http://business-service:3008
    connect_timeout: 5000
    read_timeout: 30000
    write_timeout: 30000
    retries: 0
    routes:
      # Public: a business profile by slug or id.
      - name: business-public-profile
        paths: ['~/v1/businesses/[a-z0-9-]+$']
        methods: [GET, OPTIONS]
        regex_priority: 5
        strip_path: false
      # Same methods as the public-profile route: Kong ranks routes with a
      # method condition above regex_priority alone, so this must match too.
      - name: business-mine
        paths: ['~/v1/businesses/mine$']
        methods: [GET, OPTIONS]
        regex_priority: 20
        strip_path: false
        plugins: [*jwt]
      - name: business-create
        paths: ['~/v1/businesses$']
        methods: [POST, OPTIONS]
        strip_path: false
        plugins: [*jwt]
      - name: business-update
        paths: ['~/v1/businesses/[^/]+$']
        methods: [PATCH, DELETE, OPTIONS]
        regex_priority: 5
        strip_path: false
        plugins: [*jwt]
      - name: business-manage
        paths:
          [
            '~/v1/businesses/[^/]+/(manage|hours|reports|verification|legal-profile|documents|photos|logo)($|/)',
          ]
        regex_priority: 10
        strip_path: false
        plugins: [*jwt]
      # Employee photos are business media (D-055): this outranks booking-service's
      # `/staff` routes, which would otherwise match the same path.
      - name: business-staff-photo
        paths: ['~/v1/businesses/[^/]+/staff/[^/]+/photo($|/)']
        regex_priority: 30
        strip_path: false
        plugins: [*jwt]
      - name: business-admin
        paths:
          [
            '/v1/admin/businesses',
            '/v1/admin/business-reports',
            '/v1/admin/business-documents',
            '/v1/admin/business-exports',
          ]
        strip_path: false
        plugins: [*jwt]

  # Deferred (opt-in compose profiles): routes answer 503 until started.
  - name: ads-service
    url: http://ads-service:3006
    routes:
      - name: ads
        paths: ['/v1/ads', '/v1/admin/ads', '~/v1/businesses/[^/]+/ads($|/)']
        strip_path: false
        plugins: [*jwt]

  - name: analytics-service
    url: http://analytics-service:3007
    routes:
      - name: analytics
        paths: ['~/v1/businesses/[^/]+/analytics($|/)', '/v1/admin/analytics']
        strip_path: false
        plugins: [*jwt]

plugins:
  # ── Global plugins (every route) ──

  # Who is the client? (D-084) The web app's server calls the API for its
  # visitors, so those connections come from the web server, not the visitor.
  # It sends the visitor's address and a shared key; only with that key is the
  # address believed. Every other request gets the address that actually
  # connected, whatever headers it sent. The result goes to the services in
  # X-BUKU-Client-IP (always overwritten here, never passed through), and the
  # rate limits below count by it. Runs first, in the rewrite phase.
  - name: pre-function
    config:
      rewrite:
        - |
          local key = '__WEB_GATEWAY_KEY__'
          local client = kong.client.get_forwarded_ip()
          local presented = kong.request.get_header('x-buku-web-key')
          if key ~= '' and presented == key then
            local claimed = kong.request.get_header('x-buku-client-ip')
            if type(claimed) == 'string' and #claimed <= 45 and (claimed:match('^%d+%.%d+%.%d+%.%d+$')
                or (claimed:find(':', 1, true) and claimed:match('^[%x:%.]+$'))) then
              client = claimed
            end
          end
          kong.service.request.clear_header('x-buku-web-key')
          kong.service.request.set_header('x-buku-client-ip', client)

  - name: correlation-id
    config:
      header_name: X-Request-ID
      generator: uuid
      echo_downstream: true

  - name: cors
    config:
      # Explicit allow-list, never "*". Production origins are added by the
      # production config (Phase 5).
      origins:
        - http://localhost:3000
        - http://127.0.0.1:3000
      methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
      headers: [Authorization, Content-Type, X-Request-ID, Idempotency-Key]
      exposed_headers: [X-Request-ID, RateLimit-Limit, RateLimit-Remaining, RateLimit-Reset, Retry-After]
      credentials: true
      max_age: 86400
      preflight_continue: false

  - name: request-size-limiting
    config:
      allowed_payload_size: 128
      size_unit: kilobytes
      require_content_length: false

  - name: rate-limiting
    config:
      minute: 500
      limit_by: header
      header_name: X-BUKU-Client-IP
      policy: redis
      fault_tolerant: true
      error_code: 429
      error_message: Too many requests, please slow down
      redis: *redis

  - name: response-transformer
    config:
      add:
        headers:
          - 'X-API-Version: 1'

  - name: prometheus
    config:
      status_code_metrics: true
      latency_metrics: true
      upstream_health_metrics: true
