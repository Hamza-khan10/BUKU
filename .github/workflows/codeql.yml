# Static analysis of the TypeScript code (SOC 2 CC7.1, D-082): GitHub CodeQL with the
# security-extended queries — injection, unsafe deserialisation, path traversal, SSRF,
# weak crypto and the like. Results appear under Security → Code scanning.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    # …and the database v2 integration branch, whose slices merge there first (D3, D-112).
    branches: [main, feat/db-v2-services]
  schedule:
    - cron: '23 4 * * 1' # Mondays: new queries also check unchanged code

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL (javascript-typescript)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: javascript-typescript
          queries: security-extended
          config: |
            paths-ignore:
              - '**/generated/**'
              - '**/node_modules/**'
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:javascript-typescript
