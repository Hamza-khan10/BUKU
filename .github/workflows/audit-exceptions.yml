# ═══════════════════════════════════════════════════════════════════════════
# Audit exceptions — every day, ask whether each advisory the dependency audit
# ignores (pnpm-workspace.yaml, auditConfig.ignoreGhsas) still deserves it:
# still withdrawn, no fixed version, nothing newer on npm. The day one does
# not, this fails, GitHub emails the owner, and the exception is removed by
# updating the package (SECURITY.md, "Audit exceptions").
# ═══════════════════════════════════════════════════════════════════════════
name: Audit exceptions

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Ignored advisories still need ignoring
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: node scripts/check-audit-exceptions.ts
        env:
          GITHUB_TOKEN: ${{ github.token }}
