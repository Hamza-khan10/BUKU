packages:
  - packages/*
  - services/*
  - apps/*

# ── Supply-chain policy ─────────────────────────────────────────────────────
# pnpm blocks every dependency lifecycle script by default. Only packages
# listed here may run install/postinstall scripts, and each entry needs a
# reason. Review any new entry in code review like you would review code.
allowBuilds:
  # Downloads the prebuilt librdkafka native binding (Kafka client).
  '@confluentinc/kafka-javascript': true
  # Downloads the Prisma schema engine used by `prisma migrate`.
  '@prisma/engines': true
  prisma: true
  # Installs the platform-specific esbuild binary (used by tsx and tsup).
  esbuild: true

# Refuse to resolve package versions younger than 24h, which is when most
# malicious npm releases are detected and pulled. (pnpm default, kept explicit.)
minimumReleaseAge: 1440

# Peers are declared explicitly where needed. Auto-installing them would drag
# the ~400 MB Prisma CLI (a peer of @prisma/client) into production images.
autoInstallPeers: false

# Fail the install if a dependency needs a build script that is not
# explicitly allowed above, instead of silently skipping it.
strictDepBuilds: true

# ── Security overrides ──────────────────────────────────────────────────────
# Force patched versions of vulnerable TRANSITIVE dependencies until upstream
# releases pick them up. Each entry: advisory, who pulls it in, why it is safe.
# Remove an entry once `pnpm why <pkg>` shows upstream already requires a
# patched version.
overrides:
  # GHSA-3f6p-5ww8-9rcr (high) + zlib inflate DoS (moderate). Pulled in by the
  # Prisma CLI for MySQL support, which BUKU never uses. Same major version.
  mysql2: 3.24.4
  # Stack exhaustion on recursive graphs (high). Used by @prisma/config only
  # to merge our own prisma.config.ts (plain objects); v8's breaking changes
  # concern Map merging and type names, which that code path does not use.
  deepmerge-ts: 8.0.2
  # GHSA-pqg4-j6r4-53mv (critical): quote() command injection. Pulled in by
  # launch-editor under @changesets/cli (release tooling, never at run time).
  # Same major version.
  shell-quote: 1.12.0
  # source-map-js event-loop DoS through indexed source-map offsets (high).
  # Pulled in by postcss under Next.js at build time. Same major version.
  source-map-js: 1.2.2
  # GHSA-587h-7wmj-h5pm (high) and its siblings: launch-editor's checks and escaping on Windows.
  # Pulled in by @changesets/cli (release tooling, never at run time). Same major version. (Vite,
  # which bundles the same code, is Vitest's peer and is named at the root: package.json.)
  launch-editor: 2.14.2
  # GHSA-27r3-jxmh-p828 (high): denial of service through trailing bytes after a compressed body.
  # Pulled in by Express in every service (request bodies). Within Express 5.3's own range (^2.3.0).
  body-parser: 2.4.0
  # GHSA-mrhx-c7xc-m3w5 (high): memory exhaustion validating oversized collections. Only the React
  # hooks lint plugin still resolved an older zod; it accepts any zod 4, and gets the one BUKU uses.
  eslint-plugin-react-hooks>zod: 4.6.7
